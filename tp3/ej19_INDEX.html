<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 19 — Formulario multi-step con validación</title>
  <link rel="stylesheet" href="ej19_STYLES.css">
</head>
<body>

  <form class="formulario" novalidate>

    <!-- Radios ocultos que controlan qué paso se muestra -->
    <input type="radio" name="paso" id="ir-paso1" class="control-paso" checked>
    <input type="radio" name="paso" id="ir-paso2" class="control-paso">

    <div class="indicador">
      <label for="ir-paso1" class="punto">1. Datos personales</label>
      <label for="ir-paso2" class="punto">2. Cuenta</label>
    </div>

    <!-- Paso 1 -->
    <section class="paso paso1">
      <h2>Paso 1: Datos personales</h2>

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Tu nombre">
        <span class="mensaje-error">Ingresá al menos 3 caracteres.</span>
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com">
        <span class="mensaje-error">Ingresá un email válido.</span>
      </div>

      <label for="ir-paso2" class="btn btn-siguiente">Siguiente →</label>
    </section>

    <!-- Paso 2 -->
    <section class="paso paso2">
      <h2>Paso 2: Cuenta</h2>

      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required minlength="4" placeholder="Nombre de usuario">
        <span class="mensaje-error">Ingresá al menos 4 caracteres.</span>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
        <span class="mensaje-error">La contraseña debe tener al menos 6 caracteres.</span>
      </div>

      <label for="ir-paso1" class="btn btn-atras">← Atrás</label>
      <button type="submit" class="btn btn-enviar">Enviar</button>
    </section>

  </form>

</body>
</html>
